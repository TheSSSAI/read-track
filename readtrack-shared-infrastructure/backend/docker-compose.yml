version: '3.8'

services:
  readtrack-db:
    image: postgres:16-alpine
    container_name: readtrack-db
    environment:
      - POSTGRES_DB=readtrack
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - readtrack-network

  readtrack-redis:
    image: redis:alpine
    container_name: readtrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - readtrack-network

  readtrack-api:
    build:
      context: ..
      dockerfile: backend/src/ReadTrack.Host/Dockerfile
    container_name: readtrack-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=readtrack-db;Port=5432;Database=readtrack;Username=postgres;Password=postgres_dev_password
      - ConnectionStrings__RedisConnection=readtrack-redis:6379
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      readtrack-db:
        condition: service_healthy
      readtrack-redis:
        condition: service_started
    networks:
      - readtrack-network

networks:
  readtrack-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: