name: readtrack_mobile
description: "A comprehensive reading tracking application focusing on habit formation and personalized insights."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Navigation
  go_router: ^13.1.0

  # Networking & Resilience (REQ-REL-002)
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage & Offline (REQ-OFF-001)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Authentication (REQ-USR-001)
  flutter_appauth: ^6.0.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  flutter_secure_storage: ^9.0.0

  # UI Components & Assets
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0 # For statistics (REQ-STA-001)
  intl: ^0.19.0

  # Monetization (REQ-ADS-001, US-019)
  google_mobile_ads: ^5.0.0
  in_app_purchase: ^3.1.13

  # Utilities
  flutter_dotenv: ^5.1.0
  uuid: ^4.3.3
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  isar_generator: ^3.1.0+1

  # Linting & Testing
  flutter_lints: ^3.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - .env

  # Fonts
  # fonts:
  #   - family: OpenSans
  #     fonts:
  #       - asset: assets/fonts/OpenSans-Regular.ttf
  #       - asset: assets/fonts/OpenSans-Bold.ttf
  #         weight: 700