name: readtrack_app
description: The application shell for ReadTrack, orchestrating navigation, state management, and feature composition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^14.0.1
  
  # Local Storage & Persistence (REQ-FUNC-011)
  flutter_secure_storage: ^9.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  # Utilities
  logger: ^2.0.2
  intl: ^0.19.0
  connectivity_plus: ^6.0.3 # Required for SyncService logic

  # Internal Packages (Monorepo Structure)
  readtrack_apiclient:
    path: ../packages/readtrack_apiclient
  readtrack_uikit:
    path: ../packages/readtrack_uikit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/