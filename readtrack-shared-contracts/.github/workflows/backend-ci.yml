name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - 'src/ReadTrack.Shared.Contracts/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - 'src/ReadTrack.Shared.Contracts/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test .NET Solution
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '8.0.x'
      SOLUTION_PATH: 'backend/ReadTrack.sln'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build Solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Verify Shared Contracts Compatibility
      run: |
        # Ensures that changes to shared contracts do not break the API Host compilation
        dotnet build src/ReadTrack.Shared.Contracts/ReadTrack.Shared.Contracts.csproj --configuration Release