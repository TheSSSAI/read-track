name: read_track
description: A comprehensive reading tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Network
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Local Storage
  isar: ^3.1.0+1
  isar_flutter: ^3.1.0+1
  path_provider: ^2.1.2
  
  # Authentication & Ads
  google_mobile_ads: ^5.0.0
  in_app_purchase: ^3.1.13
  sign_in_with_apple: ^6.0.0
  google_sign_in: ^6.1.6
  
  # UI
  google_fonts: ^6.1.0
  intl: ^0.19.0
  
  # Utils
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Gen
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  
  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/