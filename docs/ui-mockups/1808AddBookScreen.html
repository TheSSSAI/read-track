<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Book - Reading Tracker</title>
  <style>
    /* 
      DESIGN SYSTEM TOKENS 
      Based on Design System.md
    */
    :root {
      /* Colors */
      --color-primary-50: #EEF2FF;
      --color-primary-100: #E0E7FF;
      --color-primary-500: #6366F1;
      --color-primary-600: #4F46E5;
      --color-primary-700: #4338CA;
      --color-primary-900: #312E81;
      
      --color-secondary-500: #F43F5E;
      
      --color-neutral-white: #FFFFFF;
      --color-neutral-50: #F8FAFC;
      --color-neutral-100: #F1F5F9;
      --color-neutral-200: #E2E8F0;
      --color-neutral-300: #CBD5E1;
      --color-neutral-400: #94A3B8;
      --color-neutral-500: #64748B;
      --color-neutral-800: #1E293B;
      --color-neutral-900: #0F172A;
      
      --color-semantic-error: #EF4444;
      --color-semantic-success: #10B981;

      /* Typography */
      --font-family-primary: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-family-mono: 'JetBrains Mono', monospace;
      
      --font-size-h1: clamp(28px, 4vw, 32px);
      --font-size-h2: clamp(20px, 3vw, 24px);
      --font-size-body: 16px;
      --font-size-caption: 12px;

      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;

      /* Layout */
      --container-max-width: 1140px;
      --header-height: 64px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-round: 9999px;

      /* Shadows & Effects */
      --shadow-sm: 0px 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0px 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0px 10px 15px -3px rgba(0, 0, 0, 0.1);
      --focus-ring: 0 0 0 4px var(--color-primary-100);
    }

    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family-primary);
      background-color: var(--color-neutral-50);
      color: var(--color-neutral-900);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    input {
      font-family: inherit;
    }

    /* Layout Structure */
    .screen-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: var(--container-max-width);
      margin: 0 auto;
      background-color: var(--color-neutral-white);
      box-shadow: var(--shadow-lg);
    }

    /* Header & Navigation */
    .screen-header {
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--color-neutral-200);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      position: sticky;
      top: 0;
      background: var(--color-neutral-white);
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: var(--font-size-h2);
      font-weight: 700;
      color: var(--color-neutral-900);
    }

    .close-btn {
      color: var(--color-neutral-500);
      padding: var(--spacing-sm);
      border-radius: var(--radius-md);
      transition: background 0.2s;
    }

    .close-btn:hover {
      background-color: var(--color-neutral-100);
      color: var(--color-neutral-900);
    }

    /* Tabs Component */
    .tabs {
      display: flex;
      gap: var(--spacing-md);
      border-bottom: 2px solid var(--color-neutral-100);
    }

    .tab-btn {
      padding: var(--spacing-sm) var(--spacing-xs);
      font-weight: 500;
      color: var(--color-neutral-500);
      position: relative;
      bottom: -2px;
      transition: color 0.2s;
    }

    .tab-btn[aria-selected="true"] {
      color: var(--color-primary-600);
      border-bottom: 2px solid var(--color-primary-600);
    }

    .tab-btn:hover:not([aria-selected="true"]) {
      color: var(--color-neutral-700);
    }

    /* Main Content Area */
    .main-content {
      padding: var(--spacing-lg);
      flex: 1;
      overflow-y: auto;
    }

    /* Search Component */
    .search-container {
      position: relative;
      margin-bottom: var(--spacing-lg);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      color: var(--color-neutral-400);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 56px;
      padding: 0 48px 0 48px;
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-lg);
      font-size: var(--font-size-body);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-primary-600);
      box-shadow: var(--focus-ring);
    }

    .scan-btn {
      position: absolute;
      right: 8px;
      padding: 8px;
      color: var(--color-neutral-500);
      border-radius: var(--radius-md);
    }

    .scan-btn:hover {
      background-color: var(--color-neutral-100);
      color: var(--color-primary-600);
    }

    /* Results Grid */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-md);
    }

    @media (min-width: 600px) {
      .results-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .results-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Book List Tile */
    .book-card {
      display: flex;
      padding: var(--spacing-md);
      background: var(--color-neutral-white);
      border: 1px solid var(--color-neutral-200);
      border-radius: var(--radius-lg);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .book-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-primary-100);
    }

    .book-cover {
      width: 60px;
      height: 90px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background-color: var(--color-neutral-200);
      flex-shrink: 0;
    }

    .book-info {
      margin-left: var(--spacing-md);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .book-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-neutral-900);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .book-author {
      font-size: 14px;
      color: var(--color-neutral-500);
      margin-bottom: 8px;
    }

    .add-action {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary-600);
      background: var(--color-primary-50);
      padding: 4px 8px;
      border-radius: var(--radius-md);
    }

    /* Loading State */
    .skeleton-card {
      display: flex;
      padding: var(--spacing-md);
      border: 1px solid var(--color-neutral-100);
      border-radius: var(--radius-lg);
    }

    .skeleton-cover {
      width: 60px;
      height: 90px;
      background-color: var(--color-neutral-200);
      border-radius: var(--radius-md);
      animation: pulse 1.5s infinite;
    }

    .skeleton-info {
      flex: 1;
      margin-left: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .skeleton-line {
      height: 12px;
      background-color: var(--color-neutral-200);
      border-radius: 4px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Manual Entry Form */
    .manual-form {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-neutral-700);
    }

    .form-input {
      padding: 14px 16px;
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-md);
      font-size: 16px;
      background: var(--color-neutral-white);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary-600);
      box-shadow: var(--focus-ring);
    }

    .primary-btn {
      background-color: var(--color-primary-600);
      color: var(--color-neutral-white);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      font-weight: 600;
      font-size: 16px;
      margin-top: var(--spacing-md);
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background-color: var(--color-primary-700);
    }

    .primary-btn:disabled {
      background-color: var(--color-neutral-200);
      color: var(--color-neutral-400);
      cursor: not-allowed;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--spacing-2xl) 0;
      color: var(--color-neutral-500);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: var(--spacing-md);
      color: var(--color-neutral-300);
    }

    /* Scanner Overlay */
    .scanner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .scanner-overlay.active {
      display: flex;
    }

    .scanner-header {
      padding: var(--spacing-lg);
      display: flex;
      justify-content: space-between;
      color: white;
      background: rgba(0,0,0,0.5);
    }

    .scanner-viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-frame {
      width: 280px;
      height: 200px;
      border: 2px solid var(--color-semantic-success);
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.7);
      position: relative;
    }

    .scan-frame::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--color-semantic-error);
      box-shadow: 0 0 4px var(--color-semantic-error);
    }

    /* Utility Classes */
    .hidden {
      display: none !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- Header -->
    <header class="screen-header">
      <div class="header-top">
        <h1 class="header-title">Add Book</h1>
        <button class="close-btn" aria-label="Close add book screen">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <!-- Tabs -->
      <div class="tabs" role="tablist">
        <button class="tab-btn" role="tab" aria-selected="true" aria-controls="search-panel" id="tab-search">Search</button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="manual-panel" id="tab-manual">Manual Entry</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Search Panel -->
      <section id="search-panel" role="tabpanel" aria-labelledby="tab-search">
        <div class="search-container">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" placeholder="Search by title, author, or ISBN" id="book-search-input" aria-label="Search books">
            <button class="scan-btn" id="scan-trigger" aria-label="Scan barcode">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                <line x1="7" y1="8" x2="7" y2="16"></line>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="17" y1="8" x2="17" y2="16"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Initial Empty State -->
        <div id="initial-state" class="empty-state">
          <div class="empty-icon">📚</div>
          <p>Search for a book to add it to your library</p>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="results-grid hidden" aria-busy="true">
          <!-- Skeleton Item 1 -->
          <div class="skeleton-card">
            <div class="skeleton-cover"></div>
            <div class="skeleton-info">
              <div class="skeleton-line" style="width: 80%"></div>
              <div class="skeleton-line" style="width: 50%"></div>
            </div>
          </div>
          <!-- Skeleton Item 2 -->
          <div class="skeleton-card">
            <div class="skeleton-cover"></div>
            <div class="skeleton-info">
              <div class="skeleton-line" style="width: 70%"></div>
              <div class="skeleton-line" style="width: 40%"></div>
            </div>
          </div>
          <!-- Skeleton Item 3 -->
          <div class="skeleton-card">
            <div class="skeleton-cover"></div>
            <div class="skeleton-info">
              <div class="skeleton-line" style="width: 90%"></div>
              <div class="skeleton-line" style="width: 60%"></div>
            </div>
          </div>
        </div>

        <!-- Results Grid -->
        <div id="results-state" class="results-grid hidden" aria-live="polite">
          <!-- Book Item 1 -->
          <article class="book-card" tabindex="0">
            <img src="https://placehold.co/60x90/e2e8f0/64748b?text=Dune" alt="Cover of Dune" class="book-cover">
            <div class="book-info">
              <h4 class="book-title">Dune</h4>
              <p class="book-author">Frank Herbert</p>
              <span class="add-action">+ Add to Library</span>
            </div>
          </article>

          <!-- Book Item 2 -->
          <article class="book-card" tabindex="0">
            <img src="https://placehold.co/60x90/e2e8f0/64748b?text=Design" alt="Cover of Design of Everyday Things" class="book-cover">
            <div class="book-info">
              <h4 class="book-title">The Design of Everyday Things</h4>
              <p class="book-author">Don Norman</p>
              <span class="add-action">+ Add to Library</span>
            </div>
          </article>

          <!-- Book Item 3 -->
          <article class="book-card" tabindex="0">
            <img src="https://placehold.co/60x90/e2e8f0/64748b?text=Atomic" alt="Cover of Atomic Habits" class="book-cover">
            <div class="book-info">
              <h4 class="book-title">Atomic Habits</h4>
              <p class="book-author">James Clear</p>
              <span class="add-action">+ Add to Library</span>
            </div>
          </article>
        </div>
      </section>

      <!-- Manual Entry Panel -->
      <section id="manual-panel" role="tabpanel" aria-labelledby="tab-manual" class="hidden">
        <form class="manual-form" novalidate>
          <div class="form-group">
            <label for="title" class="form-label">Book Title</label>
            <input type="text" id="title" class="form-input" placeholder="e.g. The Hobbit" required>
          </div>

          <div class="form-group">
            <label for="author" class="form-label">Author</label>
            <input type="text" id="author" class="form-input" placeholder="e.g. J.R.R. Tolkien" required>
          </div>

          <div class="form-group">
            <label for="pages" class="form-label">Page Count</label>
            <input type="number" id="pages" class="form-input" placeholder="e.g. 310" min="1">
          </div>

          <button type="submit" class="primary-btn">Save Book</button>
        </form>
      </section>

    </main>
  </div>

  <!-- Barcode Scanner Overlay -->
  <div class="scanner-overlay" id="scanner-overlay" aria-modal="true" role="dialog" aria-label="Barcode Scanner">
    <div class="scanner-header">
      <button class="close-btn" id="close-scanner" style="color: white;">Cancel</button>
      <span>Scan ISBN</span>
      <div style="width: 40px"></div> <!-- Spacer -->
    </div>
    <div class="scanner-viewport">
      <div class="scan-frame"></div>
      <p style="position: absolute; bottom: 20%; color: white; text-align: center; width: 100%;">
        Align barcode within frame
      </p>
    </div>
  </div>

  <script>
    // Tab Switching Logic
    const tabSearch = document.getElementById('tab-search');
    const tabManual = document.getElementById('tab-manual');
    const searchPanel = document.getElementById('search-panel');
    const manualPanel = document.getElementById('manual-panel');

    function switchTab(target) {
      if (target === 'search') {
        tabSearch.setAttribute('aria-selected', 'true');
        tabManual.setAttribute('aria-selected', 'false');
        searchPanel.classList.remove('hidden');
        manualPanel.classList.add('hidden');
      } else {
        tabSearch.setAttribute('aria-selected', 'false');
        tabManual.setAttribute('aria-selected', 'true');
        searchPanel.classList.add('hidden');
        manualPanel.classList.remove('hidden');
      }
    }

    tabSearch.addEventListener('click', () => switchTab('search'));
    tabManual.addEventListener('click', () => switchTab('manual'));

    // Search Simulation Logic
    const searchInput = document.getElementById('book-search-input');
    const initialState = document.getElementById('initial-state');
    const loadingState = document.getElementById('loading-state');
    const resultsState = document.getElementById('results-state');
    let debounceTimer;

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value;

      if (query.length === 0) {
        initialState.classList.remove('hidden');
        loadingState.classList.add('hidden');
        resultsState.classList.add('hidden');
        return;
      }

      // Show loading
      initialState.classList.add('hidden');
      resultsState.classList.add('hidden');
      loadingState.classList.remove('hidden');

      // Simulate API delay
      debounceTimer = setTimeout(() => {
        loadingState.classList.add('hidden');
        resultsState.classList.remove('hidden');
      }, 800);
    });

    // Scanner Overlay Logic
    const scanTrigger = document.getElementById('scan-trigger');
    const scannerOverlay = document.getElementById('scanner-overlay');
    const closeScanner = document.getElementById('close-scanner');

    scanTrigger.addEventListener('click', () => {
      scannerOverlay.classList.add('active');
      closeScanner.focus();
    });

    closeScanner.addEventListener('click', () => {
      scannerOverlay.classList.remove('active');
      searchInput.focus();
    });

    // Manual Form Validation (Basic)
    const manualForm = document.querySelector('.manual-form');
    manualForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      
      if (title && author) {
        alert(`Book "${title}" by ${author} added!`);
        manualForm.reset();
      }
    });
  </script>
</body>
</html>
